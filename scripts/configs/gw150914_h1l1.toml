# GW150914, H1+L1, real GWOSC data (see ../../data/README.md) -- the standard 2-detector example.
# Run with: julia --project=. scripts/run_from_config.jl scripts/configs/gw150914_h1l1.toml
#
# nwalkers/nsteps below are deliberately small (a few-minute smoke run, not a publication-grade
# posterior) -- scale both up for a real analysis. See scripts/configs/README.md for the full
# field reference, including how to add a third (or Nth) detector.

[event]
trigger_time = 1126259462.4
duration = 4.0
post_trigger = 2.0
psd_segment = 1024.0
f_min = 20.0
f_max = 1024.0
alpha = 0.2
psd_method = "median"

[[detectors]]
name = "H1"
strain_path = "data/H-H1_LOSC_4_V1-1126256640-4096.hdf5"

[[detectors]]
name = "L1"
strain_path = "data/L-L1_LOSC_4_V1-1126256640-4096.hdf5"

[model]
name = "IMRPhenomXAS"

[sampler]
type = "nuts"
nwalkers = 8
nsteps = 40
nwarmup = 20
step_size = 1e-3
max_treedepth = 10
seed = 42
enforce_bounds = true

[output]
dir = "runs/gw150914_h1l1"
record_chain = true
