# Same event, single detector (H1 only) -- shows [[detectors]] with just one entry. Everything
# else about run_from_config.jl is identical; it never special-cases the detector count.

[event]
trigger_time = 1126259462.4
duration = 4.0
post_trigger = 2.0
psd_segment = 1024.0
f_min = 20.0
f_max = 1024.0
alpha = 0.2
psd_method = "median"

[[detectors]]
name = "H1"
strain_path = "data/H-H1_LOSC_4_V1-1126256640-4096.hdf5"

[model]
name = "IMRPhenomXAS"

[sampler]
type = "nuts"
nwalkers = 8
nsteps = 40
nwarmup = 20
step_size = 1e-3
seed = 42

[output]
dir = "runs/gw150914_h1_only"
record_chain = true
