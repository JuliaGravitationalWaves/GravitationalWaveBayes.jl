# Same H1+L1 event, parallel-tempered sampler instead of plain NUTS -- shows sampler.type = "pt".
# Output is the beta=1 "cold chain" (one posterior draw per step) plus per-rung swap acceptance.

[event]
trigger_time = 1126259462.4
duration = 4.0
post_trigger = 2.0
psd_segment = 1024.0
f_min = 20.0
f_max = 1024.0
alpha = 0.2
psd_method = "median"

[[detectors]]
name = "H1"
strain_path = "data/H-H1_LOSC_4_V1-1126256640-4096.hdf5"

[[detectors]]
name = "L1"
strain_path = "data/L-L1_LOSC_4_V1-1126256640-4096.hdf5"

[model]
name = "IMRPhenomXAS"

[sampler]
type = "pt"
ntemps = 4
nsteps = 40
nwarmup = 20
step_size = 1e-3
beta_min = 1e-2
swap_interval = 5
seed = 42

[output]
dir = "runs/gw150914_h1l1_pt"
