# 2026-10-05 (IMRPhenom session): IMRPhenomXP on the V100 (bin-parallel mode-sum path, XPBinParallel.jl) as
# SMC with 1024 particles -- same data, prior and likelihood options as the XHM SMC run; 15 rows: each spin vector
# uniform in the ball |chi_i| <= 0.9 (GWPrior nrows = 15). Phase sampled (it enters the precession setup).
#   julia -t 15 --project=<env with CUDA> scripts/run_from_config.jl scripts/configs/gw150914_h1l1_xp_smc1024_cuda.toml
[event]
trigger_time = 1126259462.4
duration = 4.0
post_trigger = 2.0
psd_segment = 1024.0
f_min = 20.0
f_max = 512.0
alpha = 0.2
psd_method = "median"

[[detectors]]
name = "H1"
strain_path = "data/H-H1_LOSC_4_V1-1126256640-4096.hdf5"

[[detectors]]
name = "L1"
strain_path = "data/L-L1_LOSC_4_V1-1126256640-4096.hdf5"

[model]
name = "IMRPhenomXP"

[prior]
mc = [20.0, 40.0]
q = [0.25, 1.0]
chi1 = [-0.9, 0.9]
chi2 = [-0.9, 0.9]
dL = [0.05, 1.5]
t_c = [-0.05, 0.05]
distance = "volume"
masses = "components"

[likelihood]
marginalize_phase = false
marginalize_distance = true
time_ref_frequency = 35.0
time_ref_offset = 0.12283266110168832
time_reference = "H1"

[sampler]
type = "nuts"
method = "smc"
nwalkers = 1024
nsteps = 20
nwarmup = 0
step_size = 1e-4
max_treedepth = 7
device = "cuda"
seed = 42
enforce_bounds = true
gradient_mode = "auto"
init = "prior"
smc_nfinal = 5

[output]
dir = "runs/v100_20261005/gw150914_h1l1_xp_smc1024_cuda"
record_chain = true
